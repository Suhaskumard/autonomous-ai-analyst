# Alembic configuration.
#
# There is deliberately no sqlalchemy.url here. The URL comes from DATABASE_URL
# via backend/config.py, so the CLI and the application startup path can never
# migrate two different databases — and a connection string never lands in a
# tracked file.
#
#   cd backend
#   alembic revision --autogenerate -m "add the thing"
#   alembic upgrade head
#   alembic downgrade -1
#
# The application also runs `upgrade head` itself at startup; see
# backend/utils/migrations.py for why that is safe with two processes.

[alembic]
script_location = migrations
prepend_sys_path = .
# Revision files sort by name, so the timestamp keeps them in creation order in
# a directory listing as well as in the revision graph.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
