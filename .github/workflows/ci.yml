name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan commits, not just HEAD
      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend — lint, format, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install pinned dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format — Black-compatible)
        run: ruff format --check .

      - name: Tests
        run: pytest --cov=backend --cov-report=term-missing

  postgres:
    name: Backend — the suite against Postgres
    runs-on: ubuntu-latest
    # SQLite is forgiving in ways Postgres is not, and the deployment that has a
    # worker in it cannot use SQLite at all. Running the same suite against both
    # is what stops "works on the default install" from being the only thing
    # anyone knows.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analyst
          POSTGRES_PASSWORD: analyst
          POSTGRES_DB: analyst
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analyst -d analyst"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://analyst:analyst@localhost:5432/analyst
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install pinned dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Migrations apply to an empty database, and roll back
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic current
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest

  frontend:
    name: Frontend — tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Every profile, not just the default one: a service that only exists
      # under --profile storage is a service nothing else in CI ever parses.
      - name: Compose file is valid in every profile
        run: |
          docker compose config --quiet
          docker compose --profile queue --profile postgres --profile storage --profile replica config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: analyst-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: analyst-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Backend container answers its health probe
        run: |
          docker run -d --name ci-backend -p 8000:8000 analyst-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"; docker logs ci-backend; exit 1
