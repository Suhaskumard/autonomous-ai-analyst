server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths resolve to the shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API. With this proxy the browser never makes a cross-origin
    # request, so CORS is not in play for the containerised deployment.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Training runs are long; do not cut the poll or upload short.
        proxy_read_timeout 300s;
        client_max_body_size 60m;
    }
}
