# Container hardening for a deployment that untrusted people can reach.
#
#   docker compose -f docker-compose.yml -f docker-compose.hardened.yml --profile queue up -d
#
# An override rather than the default, because every line here removes a
# capability the app does not need *in the configurations that have been
# tested*, and a tightened container that fails to start is worse than an
# untightened one that works. Turn it on deliberately, and read /readyz after.
#
# ---------------------------------------------------------------------------
# This file is half of Phase 8's sandbox story, and the smaller half.
#
# What it does: bounds the blast radius of the API and worker processes. If one
# of them is compromised, the attacker lands somewhere with no write access to
# its own filesystem, no capabilities, and no way to acquire any.
#
# What it does NOT do: isolate the analyst sandbox. Generated code runs wherever
# `SANDBOX_BACKEND` says it does, and under the default (`subprocess`) that is
# inside the API container — so every protection here is one the analysis code
# shares rather than one it is subject to. The isolation is switched on with
# `SANDBOX_BACKEND=container`, which puts each execution in its own container
# with no network namespace; see the `backend` service below and
# `docs/security.md`. Hardening this file without setting that leaves the
# interpreter conventions in analyst/runner.py as the only thing between
# generated code and the API's own credentials.
#
# Deliberately no `seccomp:` here. A custom profile REPLACES the runtime's
# default rather than adding to it, and the default is already an allowlist and
# already right for a web server, a Postgres driver and xgboost. The narrow
# profile this repo ships (ops/seccomp-analyst.json) is scoped to the sandbox
# runner's syscall surface and would break these services; it is applied via
# SANDBOX_SECCOMP_PROFILE, not here.
# ---------------------------------------------------------------------------

services:
  backend:
    # Root filesystem read-only. The app writes to exactly three places and each
    # gets an explicit mount below, so anything else trying to write fails.
    read_only: true
    tmpfs:
      # Uploads stream to a temp file before they are read; without this the
      # upload endpoint fails on a read-only root.
      - /tmp:size=512m,mode=1777
    security_opt:
      # A process cannot acquire privileges it did not start with, so a setuid
      # binary inside the image stops being a path to root.
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bounded so one runaway training run cannot take the host down with it.
    # Training is memory-hungry; raise this rather than lower it if runs OOM.
    mem_limit: 4g
    pids_limit: 512

    # --- turning the analyst sandbox into a real boundary ------------------
    #
    # Uncomment all four of the following to run generated code in its own
    # container instead of in this one. Read this first, because the trade is
    # real and it is not one-sided.
    #
    # `/var/run/docker.sock` is root on the host. Mounting it means a
    # compromised API can start a privileged container and own the machine —
    # so this exchanges "generated code escapes into the API container" for
    # "the API is compromised and owns the host". That is worth doing when the
    # analyst is the exposed surface and the API is not, which is the situation
    # Phase 8 is about, and it is NOT worth doing blind.
    #
    # The better answer, and the one to prefer where it is available, is a
    # rootless Podman socket: same flags, same image, no root. Point
    # SANDBOX_RUNTIME at `podman` and mount its user socket instead:
    #   - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock:ro
    #
    # SANDBOX_HOST_MODELS_DIR is not optional here and is the step that gets
    # missed. Bind mounts are resolved by the daemon against the HOST
    # filesystem, so the path this container sees for a snapshot is not the
    # path the daemon must be given. Set it to the host directory behind the
    # analyst-models volume. Get it wrong and the mount silently produces an
    # empty file, which surfaces as "the dataset has no rows".
    #
    # environment:
    #   SANDBOX_BACKEND: container
    #   SANDBOX_IMAGE: analyst-sandbox:latest
    #   SANDBOX_SECCOMP_PROFILE: /app/ops/seccomp-analyst.json
    #   SANDBOX_HOST_MODELS_DIR: /var/lib/docker/volumes/analyst_analyst-models/_data
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock:ro
    #   - ./ops/seccomp-analyst.json:/app/ops/seccomp-analyst.json:ro

  worker:
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    pids_limit: 512
    # The worker trains models; it never runs generated analysis code, so it
    # needs no runtime socket even when the sandbox backend is `container`.

  frontend:
    read_only: true
    tmpfs:
      # nginx writes its pid and its caches; on a read-only root it needs these.
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx binds 80 inside the container, which needs this one capability back.
    cap_add:
      - NET_BIND_SERVICE
